name: WORKING RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      # 1. Download and Unzip Ngrok
      - name: 🔽 Download Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip

      # 2. Connect to Ngrok (Using the token you gave me)
      - name: 🔌 Connect Ngrok
        shell: pwsh
        run: |
          .\ngrok\ngrok.exe config add-authtoken 37SlcjInr1RushUahbqSl08zEP3_6Xta6v3PHownT6s4tvMJm
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          Write-Host "⏳ Waiting for Ngrok to connect..."
          Start-Sleep -Seconds 10

      # 3. Get the Address (Public URL)
      - name: 🔗 Get Ngrok URL
        id: ngrok
        shell: pwsh
        run: |
          try {
            $resp = Invoke-RestMethod http://localhost:4040/api/tunnels
            $url = $resp.tunnels[0].public_url
            Write-Host "✅ YOUR URL IS: $url"
            echo "URL=$url" >> $env:GITHUB_ENV
          } catch {
            Write-Error "❌ Ngrok failed to start. Check if you have other tunnels running on your account!"
            exit 1
          }

      # 4. Enable RDP & Firewall
      - name: 🔓 Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      # 5. Set Password for "Administrator"
      - name: 👤 Set User Password
        run: |
          # We use the built-in Administrator account so we don't have permission issues
          net user administrator "OLDUSER#06" /active:yes

      # 6. Show Login Info
      - name: 📝 LOGIN DETAILS
        run: |
          Write-Host "----------------------------------------"
          Write-Host "Computer: ${{ env.URL }}"
          Write-Host "Username: administrator"
          Write-Host "Password: OLDUSER#06"
          Write-Host "----------------------------------------"

      # 7. Keep Alive (Loop)
      - name: 🔄 Keep Running
        run: |
          Write-Host "RDP is ready! Don't close this tab."
          while($true) {
            Start-Sleep -Seconds 30
          }
