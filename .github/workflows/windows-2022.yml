name: WINDOWS TOKEN RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'Paste your Ngrok Authtoken here'
        required: true  # Changed to true to ensure you don't forget it
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Download Files
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Invoke-WebRequest https://raw.githubusercontent.com/Riders004/rdp/master/start.bat -OutFile start.bat
          Invoke-WebRequest https://raw.githubusercontent.com/Riders004/rdp/master/wallpaper.bat -OutFile wallpaper.bat
          Invoke-WebRequest https://raw.githubusercontent.com/Vip3rLi0n/Ngrok-RDPs/main/resources/loop.ps1 -OutFile loop.ps1

      - name: 📦 Extract Ngrok
        run: Expand-Archive ngrok.zip

      - name: 🔐 Set Ngrok Authtoken
        shell: pwsh
        run: |
          # Priority 1: Input from the manual run box
          $inputToken = '${{ github.event.inputs.increment }}'
          
          # Priority 2: Secrets (if you set them in repo settings)
          $secretToken = $Env:NGROK_AUTH
          
          if ($inputToken -ne "") {
            $token = $inputToken
            Write-Host "👉 Using token provided in Input Box."
          } elseif ($secretToken -ne "") {
            $token = $secretToken
            Write-Host "👉 Using token from GitHub Secrets."
          } else {
            Write-Host "❌ NO TOKEN FOUND! logic will fail."
            exit 1
          }

          # Mask the token in logs so it is safe
          $maskedToken = $token.Substring(0, 4) + "..."
          Write-Host "Token detected: $maskedToken"

          .\ngrok\ngrok.exe config add-authtoken $token
        env:
          NGROK_AUTH: ${{ secrets.NGROK_AUTH }}

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Copy-Item wallpaper.bat D:\a\wallpaper.bat

      - name: 🚀 Start Ngrok Tunnel
        run: |
          # Start Ngrok and log output to a file so we can see errors if it fails
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp --region ap 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -WindowStyle Hidden

      - name: 🕐 Wait for Ngrok to Initialize
        run: Start-Sleep -Seconds 15

      - name: 🔎 Check Ngrok Logs (Debug)
        run: |
          if (Test-Path ngrok.log) {
            Get-Content ngrok.log -Head 20
          } else {
            Write-Host "❌ Ngrok log file not found."
          }

      - name: ⚙️ Run Setup Script
        shell: pwsh
        run: |
          $url = $null
          $retries = 20
          while ($retries -gt 0) {
            try {
              $tunnels = Invoke-RestMethod -Uri 'http://localhost:4040/api/tunnels' -ErrorAction Stop
              if ($tunnels.tunnels.Count -gt 0) {
                $url = $tunnels.tunnels[0].public_url
                break
              }
            } catch {
              Write-Host "⚠️ API not ready yet... retrying ($retries)"
            }
            Start-Sleep -Seconds 3
            $retries--
          }

          if (-not $url) {
            Write-Host "❌ Still no URL. Showing process list:"
            Get-Process ngrok -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "✅ SUCCESS! Ngrok Public URL: $url"

          $escapedUrl = $url.Replace('"', '\"')
          $escapedUser = 'administrator'
          $escapedPass = 'OLDUSER#06'

          # Important: Call the batch file using cmd /c
          cmd.exe /c "start.bat `"$escapedUrl`" `"$escapedUser`" `"$escapedPass`""

      - name: 🔁 Keep Runner Alive
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .\loop.ps1
